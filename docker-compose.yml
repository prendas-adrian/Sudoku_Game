version: '3.8'

services:
  mongodb:
    image: mongo:8.2.12
    container_name: sudoku_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - sudoku_network

  backend:
    build: .
    container_name: sudoku_backend
    depends_on:
      - mongodb
    environment:
      NODE_ENV: ${NODE_ENV}
      MONGODB_URI: ${MONGODB_URI}
      PORT: ${PORT}
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - sudoku_network
    command: npm start

volumes:
  mongo_data:

networks:
  sudoku_network:
    driver: bridge
